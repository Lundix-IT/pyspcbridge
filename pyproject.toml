[project]
name = "pyspcbridge"
dynamic = ["version"]
description = "Python library for communicating with acre/Vanderbilt SPC alarm system via Lundix's SPC Bridge Generic (Lite)"
authors = [{name="Lundix IT", email = "info@lundix.se"}]
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<4.0"
dependencies = [
    "httpx>=0.27.0",
    "aiohttp>=3.10.8"
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-ruff>=0.4.1",
    "ruff>=0.8.3",
]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
pattern = '(?P<base>\d+\.\d+\.\d+)'

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]
ignore = ["E501", "SIM102"]

[tool.ruff.lint.isort]
combine-as-imports = true
split-on-trailing-comma = false
